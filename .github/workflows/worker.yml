name: Pokémon worker

on:
  schedule:
    # A cada 4 horas (00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC)
    - cron: "0 */4 * * *"
  workflow_dispatch:

jobs:
  worker:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run worker (lote a cada 4h, 100 por rodada)
        run: python main.py --worker --db data/todos_pokemons.db --images data/images --batch-size 100

      - name: Export JSON (só coletados)
        run: python -c "from crawler.domain.services.storage import Storage; Storage('data/todos_pokemons.db').export_json_from_db('data/pokemon_export.json', only_done=True)"

      - name: Commit and push DB + JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/todos_pokemons.db data/pokemon_export.json
          git status
          git diff --staged --quiet || git commit -m "chore: worker update (cron)"
          git push
