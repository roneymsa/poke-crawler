name: Pokémon weekly update

on:
  schedule:
    # Todo domingo às 02:00 UTC
    - cron: "0 2 * * 0"
  workflow_dispatch:

jobs:
  sync-links:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sync (National Dex → DB)
        run: python main.py --sync-links --db data/todos_pokemons.db

      - name: Commit and push DB
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/todos_pokemons.db
          git diff --staged --quiet || git commit -m "chore: sync Pokémon links (cron)"
          git push

  worker:
    runs-on: ubuntu-latest
    needs: sync-links
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run worker
        run: python main.py --worker --db data/todos_pokemons.db --images data/images --batch-size 100

      - name: Export JSON (só coletados)
        run: python -c "from crawler.domain.services.storage import Storage; Storage('data/todos_pokemons.db').export_json_from_db('data/pokemon_export.json', only_done=True)"

      - name: Commit and push DB + JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/todos_pokemons.db data/pokemon_export.json
          git status
          git diff --staged --quiet || git commit -m "chore: worker update (cron)"
          git push
