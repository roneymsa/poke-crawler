# Poké-Crawler: rodar com Docker Compose
#
# Crawler:
#   docker compose run --rm crawler
#   docker compose run --rm crawler Pikachu Charmander
#   docker compose run --rm crawler --list pokemon_names.txt --workers 5
#
# Testes:
#   docker compose run --rm crawler python -m pytest tests/ -v

services:
  crawler:
    build: .
    volumes:
      - .:/app
    working_dir: /app
    command: ["--list", "pokemon_names.txt"]
